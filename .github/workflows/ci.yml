name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go mod tidy
      - run: make test
      - run: CGO_ENABLED=1 go test -race ./...
      - run: make cross-build VERSION=ci
