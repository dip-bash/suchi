# Publishes the binaries install.sh downloads. Push a tag to release:
#   git tag v0.5.0 && git push origin v0.5.0
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go mod tidy
      - run: make test
      - run: make cross-build VERSION=${GITHUB_REF_NAME#v}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
